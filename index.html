// Loads data from the Apps Script backend via a <script> tag instead of fetch().
// This sidesteps a CORS quirk in Google's redirect that blocks fetch() from
// reading the response, even though the URL is genuinely public.
let jsonpCounter = 0;
function jsonpFetch(url, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const callbackName = `__shipLogCb_${Date.now()}_${jsonpCounter++}`;
    const script = document.createElement("script");
    let done = false;

    const cleanup = () => {
      done = true;
      delete window[callbackName];
      script.remove();
      clearTimeout(timer);
    };
    const timer = setTimeout(() => {
      if (!done) {
        cleanup();
        reject(new Error("cloud request timed out"));
      }
    }, timeoutMs);

    window[callbackName] = (data) => {
      if (done) return;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if (done) return;
      cleanup();
      reject(new Error("cloud request failed to load"));
    };
    script.src = `${url}${url.includes("?") ? "&" : "?"}callback=${callbackName}`;
    document.body.appendChild(script);
  });
}

function useStorage(key, fallback) {
  const [value, setValue] = useState(fallback);
  const [loaded, setLoaded] = useState(false);
  const [syncing, setSyncing] = useState(false);

  useEffect(() => {
    // 1. Show something instantly from the on-device cache.
    try {
      const raw = localStorage.getItem(key);
      if (raw !== null) setValue(JSON.parse(raw));
    } catch (e) {
      // key doesn't exist yet or failed to parse
    }

    // 2. If a cloud API is configured, fetch the latest version and prefer it.
    if (!API_URL) {
      setLoaded(true);
      return;
    }
    jsonpFetch(`${API_URL}?key=${encodeURIComponent(key)}`)
      .then((remote) => {
        if (remote !== null && remote !== undefined) {
          setValue(remote);
          localStorage.setItem(key, JSON.stringify(remote));
        }
      })
      .catch((e) => {
        console.error("cloud load failed, using on-device copy", e);
      })
      .finally(() => setLoaded(true));
  }, [key]);

  const persist = async (next) => {
    setValue(next);
    try {
      localStorage.setItem(key, JSON.stringify(next));
    } catch (e) {
      console.error("storage save failed", e);
    }
    if (!API_URL) return;
    setSyncing(true);
    try {
      // "no-cors" sends the write to the sheet even though we can't read the
      // (also CORS-blocked) response back. text/plain avoids a preflight
      // that Apps Script web apps don't handle.
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ key, value: next }),
      });
    } catch (e) {
      console.error("cloud save failed, change is saved on this device only for now", e);
    } finally {
      setSyncing(false);
    }
  };

  return [value, persist, loaded];
}

function checkpoints(entry) {
  return [
    { key: "eli10", label: "Passenger briefing", done: !!entry.eli10.trim() },
    { key: "why", label: "Engine room report", done: !!entry.why.trim() },
    { key: "steps", label: "Ports of call", done: !!entry.steps.trim() },
    { key: "example", label: "Sightings", done: !!entry.example.trim() },
    { key: "bugfix", label: "SOS / all clear", done: !!(entry.bug.trim() && entry.fix.trim()) },
    { key: "sketch", label: "Chart the course", done: !!(entry.sketchNote.trim() || entry.sketchImage) },
    { key: "questions", label: "Messages in a bottle", done: !!(entry.q1.trim() || entry.q2.trim() || entry.q3.trim()) },
    { key: "summary", label: "Ship's manifest", done: !!entry.summary.trim() },
  ];
}

function scoreEntry(entry) {
  const cps = checkpoints(entry);
  const doneCount = cps.filter((c) => c.done).length;
  const all = doneCount === cps.length;
  let miles = doneCount * MILES_PER_CHECKPOINT + (all ? BONUS_ALL_MILES : 0);
  let coal = doneCount * COAL_PER_CHECKPOINT + (all ? BONUS_ALL_COAL : 0);
  if (entry.sketchImage) coal += CHART_BONUS_COAL;
  const stars = doneCount >= 8 ? 3 : doneCount >= 5 ? 2 : doneCount >= 2 ? 1 : 0;
  return { miles, coal, stars, doneCount, total: cps.length };
}

function entryToText(entry, topicName) {
  const stepList = entry.steps ? entry.steps.split("\n").filter(Boolean) : [];
  const qs = [entry.q1, entry.q2, entry.q3].filter((q) => q && q.trim());
  const lines = [];
  lines.push(`${topicName || "Topic"} — Feynman Summary`);
  lines.push(`Date: ${entry.date}`);
  lines.push("");
  if (entry.eli10) { lines.push("Explanation:"); lines.push(entry.eli10); lines.push(""); }
  if (entry.why) { lines.push("Why it happens:"); lines.push(entry.why); lines.push(""); }
  if (stepList.length) { lines.push("Steps:"); stepList.forEach((s, i) => lines.push(`${i + 1}. ${s}`)); lines.push(""); }
  if (entry.example) { lines.push("Real-world example:"); lines.push(entry.example); lines.push(""); }
  if (entry.bug || entry.fix) {
    lines.push("Common mistake:");
    if (entry.bug) lines.push(`Misconception: ${entry.bug}`);
    if (entry.fix) lines.push(`Correction: ${entry.fix}`);
    lines.push("");
  }
  if (entry.sketchNote) { lines.push("Sketch notes:"); lines.push(entry.sketchNote); lines.push(""); }
  if (qs.length) { lines.push("Open questions:"); qs.forEach((q) => lines.push(`- ${q}`)); lines.push(""); }
  if (entry.summary) { lines.push("Summary:"); lines.push(entry.summary); }
  return lines.join("\n");
}

function downloadTextFile(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function rankFromMiles(totalMiles) {
  const level = Math.floor(totalMiles / MILES_PER_RANK) + 1;
  const idx = Math.min(level - 1, RANKS.length - 1);
  const extra = level > RANKS.length ? ` ${level - RANKS.length + 1}` : "";
  const title = RANKS[idx] + extra;
  const icon = RANK_ICONS[idx];
  const into = totalMiles % MILES_PER_RANK;
  return { level, title, icon, pct: Math.round((into / MILES_PER_RANK) * 100) };
}

        <button

const inputCls = "w-full text-base sm:text-sm px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-800 bg-white";

const INK_COLORS = ["#0f172a", "#1e3a8a", "#b91c1c", "#a16207", "#15803d", "#7c3aed", "#eab308"];
const BRUSH_SIZES = [2, 4, 8];

function SketchCanvas({ onSave }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const historyRef = useRef([]);
  const [color, setColor] = useState(INK_COLORS[0]);
  const [size, setSize] = useState(4);
  const [eraser, setEraser] = useState(false);
  const [hasContent, setHasContent] = useState(false);

  useEffect(() => {
    const ctx = canvasRef.current.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
  }, []);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  const pushHistory = () => {
    historyRef.current.push(canvasRef.current.toDataURL());
    if (historyRef.current.length > 15) historyRef.current.shift();
  };

  const startDraw = (e) => {
    e.preventDefault();
    pushHistory();
    drawingRef.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
    canvasRef.current.setPointerCapture(e.pointerId);
  };

  const draw = (e) => {
    if (!drawingRef.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const { x, y } = getPos(e);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = eraser ? "#ffffff" : color;
    ctx.lineWidth = eraser ? size * 5 : size;
    ctx.lineTo(x, y);
    ctx.stroke();
    setHasContent(true);
  };

  const endDraw = () => { drawingRef.current = false; };

  const undo = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const last = historyRef.current.pop();
    if (!last) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      setHasContent(false);
      return;
    }
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = last;
  };

  const clearAll = () => {
    pushHistory();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    setHasContent(false);
  };

  return (
    <div className="space-y-2">
      <div className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg p-2">
        <div className="flex items-center gap-1.5">
          {INK_COLORS.map((c) => (
            <button
              key={c}
              type="button"
              onClick={() => { setColor(c); setEraser(false); }}
              className={`w-9 h-9 min-h-9 rounded-full border-2 ${!eraser && color === c ? "border-blue-800" : "border-transparent"}`}
              style={{ backgroundColor: c }}
              aria-label={`ink color ${c}`}
            />
          ))}
        </div>
        <div className="w-px h-7 bg-slate-200" />
        <div className="flex items-center gap-1">
          {BRUSH_SIZES.map((s) => (
            <button
              key={s}
              type="button"
              onClick={() => { setSize(s); setEraser(false); }}
              className={`w-9 h-9 min-h-9 rounded-lg border flex items-center justify-center ${size === s && !eraser ? "border-blue-800 bg-blue-50" : "border-slate-200 bg-white"}`}
            >
              <span className="rounded-full bg-slate-700" style={{ width: s + 3, height: s + 3 }} />
            </button>
          ))}
        </div>
        <div className="w-px h-7 bg-slate-200" />
        <button
          type="button"
          onClick={() => setEraser(!eraser)}
          className={`flex items-center gap-1 px-3 py-2 min-h-9 rounded-lg text-xs font-medium border ${eraser ? "bg-blue-900 text-white border-blue-900" : "bg-white text-slate-500 border-slate-200"}`}
        >
          <Eraser size={14} /> Eraser
        </button>
        <button type="button" onClick={undo} className="flex items-center gap-1 px-3 py-2 min-h-9 rounded-lg text-xs font-medium border bg-white text-slate-500 border-slate-200">
          <Undo2 size={14} /> Undo
        </button>
        <button type="button" onClick={clearAll} className="flex items-center gap-1 px-3 py-2 min-h-9 rounded-lg text-xs font-medium border bg-white text-slate-500 border-slate-200">
          <Trash2 size={14} /> Clear
        </button>
      </div>

      <canvas
        ref={canvasRef}
        width={900}
        height={420}
        onPointerDown={startDraw}
        onPointerMove={draw}
        onPointerUp={endDraw}
        onPointerLeave={endDraw}
        className="w-full rounded-lg border border-slate-300 bg-white touch-none"
        style={{ aspectRatio: "900 / 420" }}
      />

      <button
        type="button"
        onClick={() => onSave(canvasRef.current.toDataURL("image/png"))}
        disabled={!hasContent}
        className="w-full flex items-center justify-center gap-1.5 text-sm px-4 py-2.5 min-h-11 rounded-lg bg-blue-950 text-white disabled:opacity-30"
      >
        <Compass size={14} /> Save sketch to log
      </button>
    </div>
  );
}

function escapeXml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function MindMapEditor({ onSave }) {
  const [heading, setHeading] = useState("");
  const [nodes, setNodes] = useState(["", ""]);

  const updateNode = (i, val) => setNodes(nodes.map((n, idx) => (idx === i ? val : n)));
  const addNode = () => nodes.length < 8 && setNodes([...nodes, ""]);
  const removeNode = (i) => setNodes(nodes.filter((_, idx) => idx !== i));

  const filled = nodes.map((n) => n.trim()).filter(Boolean);
  const canSave = heading.trim() && filled.length > 0;

  const buildSvg = () => {
    const w = 900, h = 480;
    const cx = w / 2, cy = h / 2;
    const r = filled.length > 0 ? 190 : 0;
    let lines = "";
    let nodeEls = "";
    filled.forEach((text, i) => {
      const angle = (2 * Math.PI * i) / filled.length - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      lines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#94a3b8" stroke-width="2.5" />`;
      const label = escapeXml(text.slice(0, 22));
      nodeEls += `
        <rect x="${x - 78}" y="${y - 24}" width="156" height="48" rx="10" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5" />
        <text x="${x}" y="${y + 5}" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">${label}</text>
      `;
    });
    const headingLabel = escapeXml((heading.trim() || "Topic").slice(0, 26));
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <rect width="${w}" height="${h}" fill="#ffffff" />
      ${lines}
      <rect x="${cx - 115}" y="${cy - 30}" width="230" height="60" rx="14" fill="#1e3a8a" />
      <text x="${cx}" y="${cy + 7}" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">${headingLabel}</text>
      ${nodeEls}
    </svg>`;
  };

  const save = () => {
    const svgStr = buildSvg();
    const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 900;
      canvas.height = 480;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      onSave(canvas.toDataURL("image/png"));
    };
    img.src = url;
  };

  return (
    <div className="space-y-3">
      <input
        value={heading}
        onChange={(e) => setHeading(e.target.value)}
        placeholder="Central idea (e.g. Photosynthesis)"
        className={inputCls}
      />
      <div className="space-y-2">
        {nodes.map((n, i) => (
          <div key={i} className="flex items-center gap-2">
            <input
              value={n}
              onChange={(e) => updateNode(i, e.target.value)}
              placeholder={`Branch ${i + 1}`}
              className={inputCls}
            />
            {nodes.length > 1 && (
              <button
                type="button"
                onClick={() => removeNode(i)}
                className="p-2.5 min-h-11 min-w-11 flex items-center justify-center text-slate-400 hover:text-rose-500 shrink-0"
              >
                <X size={16} />
              </button>
            )}
          </div>
        ))}
      </div>
      {nodes.length < 8 && (
        <button
          type="button"
          onClick={addNode}
          className="flex items-center gap-1.5 text-xs px-3 py-2 min-h-9 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:border-blue-800 hover:text-blue-900"
        >
          <Plus size={14} /> Add branch
        </button>
      )}

      <div className="border border-slate-200 rounded-lg bg-white overflow-hidden">
        <div dangerouslySetInnerHTML={{ __html: buildSvg() }} />
      </div>

      <button
        type="button"
        onClick={save}
        disabled={!canSave}
        className="w-full flex items-center justify-center gap-1.5 text-sm px-4 py-2.5 min-h-11 rounded-lg bg-blue-950 text-white disabled:opacity-30"
      >
        <Compass size={14} /> Save mind map to log
      </button>
    </div>
  );
}

  const handleDownload = (e) => {
    e.stopPropagation();
    const text = entryToText(entry, topicName);
    const safeName = (topicName || "entry").replace(/[^a-z0-9]+/gi, "-").toLowerCase();

    e.stopPropagation();
    const text = entryToText(entry, topicName);

              <button onClick={handleCopy} className="flex items-center gap-1.5 text-xs px-3 py-2 min-h-9 rounded-lg border border-slate-200 text-slate-500 hover:border-blue-800 hover:text-blue-900">
                {copied ? <CheckIcon size={13} className="text-emerald-600" /> : <Copy size={13} />}
                {copied ? "Copied" : "Copy text"}
              </button>
              <button onClick={handleDownload} className="flex items-center gap-1.5 text-xs px-3 py-2 min-h-9 rounded-lg border border-slate-200 text-slate-500 hover:border-blue-800 hover:text-blue-900">
                <Download size={13} /> Download .txt
              </button>
              <button onClick={onEdit} className="flex items-center gap-1.5 text-xs px-3 py-2 min-h-9 rounded-lg border border-slate-200 text-slate-500 hover:border-blue-800 hover:text-blue-900">
                <Pencil size={13} /> Edit
              </button>
              <button onClick={onDelete} className="flex items-center gap-1.5 text-xs px-3 py-2 min-h-9 rounded-lg border border-rose-200 text-rose-500 hover:bg-rose-50">
                <Trash2 size={13} /> Delete
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FeynmanNotebook() {
  const [topics, saveTopics, topicsLoaded] = useStorage("notebook-topics", SEED_TOPICS);
  const [entries, saveEntries, entriesLoaded] = useStorage("notebook-entries", SEED_ENTRIES);
  const [ledger, saveLedger, ledgerLoaded] = useStorage("notebook-ledger", SEED_LEDGER);

  const [viewFilter, setViewFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [activeTopicId, setActiveTopicId] = useState(null);
  const [addingTopic, setAddingTopic] = useState(false);
  const [addingEntry, setAddingEntry] = useState(false);
  const [editingEntryId, setEditingEntryId] = useState(null);
  const [justPromoted, setJustPromoted] = useState(false);

  useEffect(() => {
    if (topicsLoaded && !activeTopicId && topics.length > 0) setActiveTopicId(topics[0].id);
  }, [topicsLoaded, topics, activeTopicId]);

  // totals only ever go up — edits and deletions never take miles/coal/stars away,
  // so the app rewards showing up rather than punishing changes of mind.
  const totals = { miles: ledger.totalMiles || 0, coal: ledger.totalCoal || 0, stars: ledger.totalStars || 0 };

  const filteredTopics = useMemo(() => {
    return topics.filter((t) => {
      if (viewFilter !== "all" && !t.viewTags.includes(viewFilter)) return false;
      if (search && !t.name.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }, [topics, viewFilter, search]);

  const activeTopic = topics.find((t) => t.id === activeTopicId);
  const topicEntries = entries
    .filter((e) => e.topicId === activeTopicId)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const createTopic = async (topic) => {
    await saveTopics([topic, ...topics]);
    setActiveTopicId(topic.id);
    setAddingTopic(false);
  };

  const deleteTopic = async (id) => {
    if (!confirm("Scuttle this voyage and all its log entries?")) return;
    await saveTopics(topics.filter((t) => t.id !== id));
    await saveEntries(entries.filter((e) => e.topicId !== id));
    if (activeTopicId === id) setActiveTopicId(null);
    // Note: ledger totals (miles/coal/stars) are intentionally left untouched —
    // progress already earned isn't taken back by deleting a voyage.
  };

  const saveNewEntry = async (entry) => {
    const score = scoreEntry(entry);
    const prevLevel = rankFromMiles(totals.miles).level;
    const nextLevel = rankFromMiles(totals.miles + score.miles).level;
    const enriched = { ...entry, topicId: activeTopicId, milesEarned: score.miles, coalEarned: score.coal, starsEarned: score.stars };
    await saveEntries([enriched, ...entries]);
    await saveLedger({
      totalMiles: (ledger.totalMiles || 0) + score.miles,
      totalCoal: (ledger.totalCoal || 0) + score.coal,
      totalStars: (ledger.totalStars || 0) + score.stars,
      topicStars: { ...ledger.topicStars, [activeTopicId]: (ledger.topicStars?.[activeTopicId] || 0) + score.stars },
    });
    setAddingEntry(false);
    if (nextLevel > prevLevel) {
      setJustPromoted(true);
      setTimeout(() => setJustPromoted(false), 2500);
    }
  };

  const updateEntry = async (entry) => {
    const original = entries.find((e) => e.id === entry.id) || {};
    const oldMiles = original.milesEarned || 0;
    const oldCoal = original.coalEarned || 0;
    const oldStars = original.starsEarned || 0;
    const freshScore = scoreEntry(entry);
    // an edit can only ever earn more than what the entry already had — never less.
    const finalMiles = Math.max(freshScore.miles, oldMiles);
    const finalCoal = Math.max(freshScore.coal, oldCoal);
    const finalStars = Math.max(freshScore.stars, oldStars);
    const deltaMiles = finalMiles - oldMiles;
    const deltaCoal = finalCoal - oldCoal;
    const deltaStars = finalStars - oldStars;

    const enriched = { ...entry, milesEarned: finalMiles, coalEarned: finalCoal, starsEarned: finalStars };
    await saveEntries(entries.map((e) => (e.id === enriched.id ? enriched : e)));

    if (deltaMiles > 0 || deltaCoal > 0 || deltaStars > 0) {
      const prevLevel = rankFromMiles(totals.miles).level;
      const nextLevel = rankFromMiles(totals.miles + deltaMiles).level;
      await saveLedger({
        totalMiles: (ledger.totalMiles || 0) + deltaMiles,
        totalCoal: (ledger.totalCoal || 0) + deltaCoal,
        totalStars: (ledger.totalStars || 0) + deltaStars,
        topicStars: { ...ledger.topicStars, [entry.topicId]: (ledger.topicStars?.[entry.topicId] || 0) + deltaStars },
      });
      if (nextLevel > prevLevel) {
        setJustPromoted(true);
        setTimeout(() => setJustPromoted(false), 2500);
      }
    }
    setEditingEntryId(null);
  };

  const deleteEntry = async (entryId) => {
    if (!confirm("Delete this log entry? This can't be undone.")) return;
    await saveEntries(entries.filter((e) => e.id !== entryId));
    if (editingEntryId === entryId) setEditingEntryId(null);
    // Note: ledger totals are intentionally left untouched — miles, coal, and
    // stars already earned stay earned, even if the entry itself is removed.
  };

  const toggleTopicTag = async (topicId, group, tagId) => {
    const next = topics.map((t) => {
      if (t.id !== topicId) return t;
      const list = t[group];
      return { ...t, [group]: list.includes(tagId) ? list.filter((x) => x !== tagId) : [...list, tagId] };
    });
    await saveTopics(next);
  };

  if (!topicsLoaded || !entriesLoaded || !ledgerLoaded) {
    return <div className="p-8 text-sm text-slate-400 flex items-center gap-2"><Ship size={16} className="animate-pulse" /> Casting off…</div>;
  }

  return (
    <div className="min-h-screen bg-slate-50 text-slate-900">
      <div className="max-w-5xl mx-auto px-4 py-6">
        <div className="flex items-center gap-2 mb-1">
          <Ship size={18} className="text-blue-900" />
          <h1 className="text-lg font-semibold">J.J.'s Ship Log</h1>
        </div>
        <p className="text-sm text-slate-400 mb-4">Log what you've learned, sail more miles, rise through the ranks</p>

        <Hud totalMiles={totals.miles} totalCoal={totals.coal} totalStars={totals.stars} justPromoted={justPromoted} />

        <div className="flex flex-col lg:flex-row gap-6">
          {/* Sidebar */}
          <div className="w-full lg:w-64 lg:shrink-0 space-y-3">
            <div className="flex bg-slate-100 rounded-lg p-1 gap-1">
              {[
                { id: "all", label: "All" },
                { id: "school", label: "YBIP" },
                { id: "explore", label: "Curious" },
              ].map((v) => (
                <button
                  key={v.id}
                  onClick={() => setViewFilter(v.id)}
                  className={`flex-1 text-xs py-2.5 min-h-11 rounded-md font-medium transition ${
                    viewFilter === v.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-400"
                  }`}
                >
                  {v.label}
                </button>
              ))}
            </div>

            <div className="relative">
              <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
              <input
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search voyages"
                className="w-full text-base sm:text-sm pl-9 pr-3 py-2.5 min-h-11 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-800"
              />
            </div>

            <div className="space-y-1">
              {filteredTopics.map((t) => {
                const tStars = ledger.topicStars?.[t.id] || 0;
                return (
                  <button
                    key={t.id}
                    onClick={() => { setActiveTopicId(t.id); setAddingEntry(false); }}
                    className={`w-full text-left px-3 py-3 min-h-11 rounded-lg text-sm transition ${
                      activeTopicId === t.id ? "bg-white border border-slate-200 shadow-sm" : "hover:bg-slate-100"
                    }`}
                  >
                    <div className="flex items-center justify-between gap-2">
                      <p className={`truncate ${activeTopicId === t.id ? "font-medium text-slate-900" : "text-slate-600"}`}>{t.name}</p>
                      {tStars > 0 && <span className="text-xs text-amber-500 flex items-center gap-0.5 shrink-0"><Star size={10} className="fill-amber-400" />{tStars}</span>}
                    </div>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {t.viewTags.map((vt) => {
                        const v = VIEW_TAGS.find((x) => x.id === vt);
                        return v ? <Chip key={vt} className={v.color}>{v.label}</Chip> : null;
                      })}
                      {t.examTags.map((et) => {
                        const e = EXAM_TAGS.find((x) => x.id === et);
                        return e ? <Chip key={et} className={e.color}>{e.label}</Chip> : null;
                      })}
                    </div>
                  </button>
                );
              })}
              {filteredTopics.length === 0 && (
                <p className="text-xs text-slate-400 px-2 py-3">No voyages match.</p>
              )}
            </div>

            {addingTopic ? (
              <NewTopicForm onCancel={() => setAddingTopic(false)} onCreate={createTopic} />
            ) : (
              <button
                onClick={() => setAddingTopic(true)}
                className="w-full flex items-center justify-center gap-1.5 text-sm py-3 min-h-11 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:border-blue-800 hover:text-blue-900"
              >
                <Plus size={15} /> New voyage
              </button>
            )}
          </div>

          {/* Main */}
          <div className="flex-1 min-w-0">
            {!activeTopic ? (
              <div className="text-sm text-slate-400 py-12 text-center">Pick or chart a voyage to set sail.</div>
            ) : (
              <div className="space-y-4">
                <div className="flex items-start justify-between">
                  <div>
                    <h2 className="text-xl font-semibold">{activeTopic.name}</h2>
                    <p className="text-sm text-slate-400">{activeTopic.subject} · {topicEntries.length} {topicEntries.length === 1 ? "log entry" : "log entries"}</p>
                  </div>
                  <button onClick={() => deleteTopic(activeTopic.id)} className="text-slate-300 hover:text-rose-500 p-2.5 min-h-11 min-w-11 flex items-center justify-center">
                    <Trash2 size={16} />
                  </button>
                </div>

                <div className="flex flex-wrap gap-1.5">
                  {VIEW_TAGS.map((v) => (
                    <TagToggle key={v.id} active={activeTopic.viewTags.includes(v.id)} className={v.color} onClick={() => toggleTopicTag(activeTopic.id, "viewTags", v.id)}>
                      <v.icon size={12} /> {v.label}
                    </TagToggle>
                  ))}
                  {EXAM_TAGS.map((t) => (
                    <TagToggle key={t.id} active={activeTopic.examTags.includes(t.id)} className={t.color} onClick={() => toggleTopicTag(activeTopic.id, "examTags", t.id)}>
                      {t.label}
                    </TagToggle>
                  ))}
                </div>

                {addingEntry ? (
                  <EntryForm initial={emptyEntry()} onCancel={() => setAddingEntry(false)} onSave={saveNewEntry} />
                ) : (
                  <button
                    onClick={() => { setAddingEntry(true); setEditingEntryId(null); }}
                    className="flex items-center gap-1.5 text-sm px-4 py-2.5 min-h-11 rounded-lg bg-blue-950 text-white hover:bg-blue-900"
                  >
                    <Plus size={15} /> Log new entry
                  </button>
                )}

                <div className="space-y-2 pt-2">
                  {topicEntries.length === 0 && !addingEntry && (
                    <p className="text-sm text-slate-400 py-6 text-center">No log entries yet — write your first one above.</p>
                  )}
                  {topicEntries.map((entry) =>
                    editingEntryId === entry.id ? (
                      <EntryForm
                        key={entry.id}
                        initial={entry}
                        submitLabel="Save changes"
                        onCancel={() => setEditingEntryId(null)}
                        onSave={updateEntry}
                      />
                    ) : (
                      <EntryCard
                        key={entry.id}
                        entry={entry}
                        topicName={activeTopic.name}
                        onEdit={() => { setEditingEntryId(entry.id); setAddingEntry(false); }}
                        onDelete={() => deleteEntry(entry.id)}
                      />
                    )
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FeynmanNotebook />);

</script>

<script>
(function () {
  function showError(message) {
    var el = document.getElementById("root");
    if (el) {
      el.innerHTML = '<div style="padding:2rem; font-family: system-ui, sans-serif; color: #b91c1c; font-size: 13px; max-width: 560px; white-space: pre-wrap;">' +
        message + '</div>';
    }
  }

  window.addEventListener("load", function () {
    setTimeout(function () {
      if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
        showError("Could not load required scripts from cdnjs.cloudflare.com. Check your internet connection, or that this network/browser is not blocking cdnjs.cloudflare.com, then reload the page.");
      }
    }, 4000);
  });

  try {
    var source = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx"
    }).code;
    var script = document.createElement("script");
    script.textContent = compiled;
    document.body.appendChild(script);
  } catch (err) {
    showError("Failed to start the app:\n\n" + (err && err.message ? err.message : err));
    console.error(err);
  }
})();
</script>
</body>
