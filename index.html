<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.J.'s Ship Log</title>
<style>
:root{--navy:#0E2238;--deep:#173A5C;--brass:#C9A24B;--cream:#F3EAD3;--red:#B5412F;--sea:#2F6F73}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);font:17px/1.4 system-ui,-apple-system,sans-serif;
background:var(--navy) repeating-linear-gradient(90deg,#0E2238 0 46px,#112a45 46px 48px);
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;margin:0;font-weight:700}
h1{font-size:32px;color:var(--brass)}h2{font-size:24px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.sub{margin:2px 0 18px;opacity:.75}
button{font:inherit;cursor:pointer}
.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.shelf{aspect-ratio:1;border-radius:50%;border:7px solid var(--brass);background:radial-gradient(circle at 35% 30%,#2b6a8f,var(--deep));
color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #7a5f22,0 3px 8px #0008;padding:4px}
.shelf b{font:700 30px Palatino,Georgia,serif}.shelf span{font-size:13px;text-align:center;line-height:1.1}
.big{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;margin:14px 0;border:0;border-radius:14px;background:var(--cream);
color:var(--navy);font:700 22px Palatino,Georgia,serif;padding:8px 18px;text-align:left;box-shadow:0 5px 0 var(--brass)}
.big small{display:block;font:400 14px system-ui;opacity:.7}.big em{font-style:normal;font-size:34px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass)}
.big.life{background:var(--red);color:#fff;min-height:64px;margin-top:28px}
.banner{background:#4a3a14;border:2px solid var(--brass);border-radius:10px;padding:10px 14px;margin:10px 0}
.back{background:none;border:0;color:var(--brass);font-size:18px;padding:8px 0;min-height:44px}
textarea{width:100%;min-height:170px;border:4px solid var(--brass);border-radius:12px;background:var(--cream);color:#1a1a1a;font:20px/1.4 system-ui;padding:14px;resize:vertical}
textarea.code{min-height:90px;font:13px monospace;margin:6px 0}
.act{border:0;border-radius:12px;background:var(--brass);color:var(--navy);font:700 20px Palatino,Georgia,serif;min-height:56px;padding:0 22px;margin:10px 8px 10px 0}
.act.red{background:var(--red);color:#fff}.act.ghost{background:none;border:2px solid var(--brass);color:var(--brass)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--brass);background:none;color:var(--cream)}
.chip.on{background:var(--brass);color:var(--navy);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:6px 2px}
.card{position:relative;min-height:110px;padding:20px 12px 10px;background:#fff7da;color:#222;border-radius:4px;transform:rotate(var(--r));box-shadow:0 3px 6px #0007;word-wrap:break-word;overflow:hidden}
.card p{margin:0 0 8px;font-size:16px;white-space:pre-wrap}.card small{opacity:.55;font-size:12px}.card img{width:100%;border-radius:2px}
.c5{background:#dbe8fb}.c6{background:#ffe3ef}
.c1{background:#dff1ee}.c2{background:#fbdcd4}.c3{background:#e4e0f6}.c4{background:#e6f0cd}
.pin{position:absolute;top:5px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pc,var(--red));box-shadow:0 2px 2px #0006,inset 0 0 0 1px #0003}
.card.sel{outline:5px solid var(--brass);outline-offset:2px}
.bar{position:sticky;bottom:8px;display:flex;flex-wrap:wrap;background:var(--deep);border:2px solid var(--brass);border-radius:14px;padding:6px 10px;margin-top:12px}
.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.box{background:var(--cream);color:var(--navy);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.opt{display:block;width:100%;min-height:52px;margin:8px 0;border:2px solid var(--navy);border-radius:10px;background:#fff;color:var(--navy);font-size:18px;text-align:left;padding:0 14px}
.opt.ghost{border-color:transparent;background:none;text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--brass);color:var(--navy);font-weight:700;padding:12px 20px;border-radius:24px;z-index:10}
.page{background:#fbf5e3;color:#243447;border-radius:6px;border-left:6px double #c9573f;padding:14px 14px 18px 18px;margin:10px 0;box-shadow:0 4px 12px #0008}
.dline{width:100%;border:0;border-bottom:2px solid #9fb3c8;background:none;color:#243447;font:20px Palatino,Georgia,serif;min-height:44px;padding:4px 2px;margin-bottom:8px;border-radius:0}
.dline.big2{font-size:24px;font-weight:700}
.q h3{font:700 19px Palatino,Georgia,serif;margin:20px 0 0;color:#173A5C}.hint{margin:0 0 4px;font-size:15px;opacity:.7}.q label{font-size:14px;opacity:.7}
textarea.ruled{border:0;border-radius:0;background:repeating-linear-gradient(#fbf5e3 0 31px,#c5d3e2 31px 32px);font:19px/32px Palatino,Georgia,serif;min-height:0;padding:0 4px;color:#243447;resize:none}
.stage{border:5px solid var(--brass);border-radius:10px;overflow:hidden;background:#F6EFD9;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:auto}
.trayrow{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.tray.more{width:62px;font:700 14px system-ui;color:var(--navy)}
.hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.act.sm{min-height:48px;font-size:17px;margin:2px 6px 2px 0}
.wrap.wide{max-width:1100px}.tbl{display:grid;gap:10px}.side{min-width:0}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stage{margin:0 auto}
@media(min-width:900px){.tbl{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.stage{max-width:calc((100vh - 150px)*1.3333);margin:0}}
.srch{flex-basis:100%;min-height:44px;border-radius:22px;border:2px solid var(--brass);padding:0 14px;font-size:16px;background:#fff;color:#173A5C}.kws{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.kws .chip{min-height:36px;padding:0 12px;font-size:14px}.tgrid{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.tray{flex:none;width:62px;height:62px;border:2px solid var(--brass);border-radius:12px;background:#F6EFD9;padding:4px}
.tray.fig{width:96px;font:700 14px system-ui;color:var(--navy)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tb{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--brass);background:var(--deep);color:var(--cream);font-size:22px}
.tb.on{background:var(--brass);color:var(--navy)}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid #fff;padding:0}
.hud{background:var(--deep);border:2px solid var(--brass);border-radius:12px;padding:10px 14px;margin:0 0 14px}.rk{font:700 21px Palatino,Georgia,serif;color:var(--brass)}.prog{height:10px;background:#0006;border-radius:6px;margin:6px 0;overflow:hidden}.prog i{display:block;height:100%;background:var(--brass)}.stats{display:flex;gap:16px;font-size:16px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:8px}.prod{background:var(--cream);color:var(--navy);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.pv{width:100%;height:140px;border-radius:8px;overflow:hidden}.pv svg{width:100%;height:100%}.own{color:#2c7a3f;font-weight:700;min-height:48px;display:flex;align-items:center}
.opt.danger{background:var(--red);color:#fff;border-color:var(--red)}
.swrow{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}.sw2{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0006;padding:0}.sw2.on{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}
.card.prev{width:130px;min-height:84px;margin:8px 0 4px;transform:rotate(-2deg)}.lbl{font-weight:700;margin:10px 0 0}
.orient{flex-basis:100%;display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:4px}.compass{display:grid;grid-template-columns:repeat(3,48px);gap:6px}.compass i{display:block}.flips{display:flex;flex-direction:column;gap:6px}.flips .tb{padding:0 12px;font-size:17px}
.ol{margin:6px 0 10px;padding-left:22px;line-height:1.5}
.banner-art{display:block;width:100%;max-height:150px;margin:0 0 4px}.namerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.namerow h1{margin:0;overflow-wrap:anywhere}.editname{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--brass);background:var(--deep);color:var(--brass);font-size:20px}.shipemo{margin-right:8px}.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin:6px 0}.emo{min-height:48px;border-radius:10px;border:2px solid #0E22384d;background:#fff;font-size:26px;padding:0}.emo.on{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}.txtrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.lowhead{margin:26px 0 8px;font:700 19px Palatino,Georgia,serif;color:var(--brass);opacity:.9}
.note{opacity:.8;font-size:15px}.empty{opacity:.7;padding:24px 0;text-align:center}
</style></head>
<body><div id="app"></div>
<script>
(function(){
'use strict';
const T={note:{title:'The Notice Board',word:'cabin',shelf:'Note Cabins'},drawing:{title:'The Chart Room',word:'chart folder',shelf:'Chart Room'},log:{title:'The Library',word:'shelf',shelf:'Library'}};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const hash=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0);
function h(t,a,...c){a=a||{};const e=document.createElement(t);for(const k in a){if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else if(k==='class')e.className=a[k];else e.setAttribute(k,a[k]);}
c.flat().forEach(x=>{if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x));});return e;}
const fill=(el,...c)=>{el.replaceChildren(...c.flat(Infinity).filter(x=>x!=null&&x!==false));};
const dlg=(title,body,btns)=>new Promise(res=>{const ov=h('div',{class:'sheet'}),done=v=>{ov.remove();res(v);};
ov.append(h('div',{class:'box'},h('h2',{},title),body,btns.map(([l,v,c])=>h('button',{class:'opt'+(c?' '+c:''),onclick:()=>done(typeof v==='function'?v():v)},l))));document.body.append(ov);});
const ask=(msg,yes)=>dlg(msg,null,[[yes||'Yes',true,'danger'],['Cancel',false,'ghost']]);
const say=msg=>dlg(msg,null,[['OK',true]]);
const askText=(title,init)=>{const i=h('input',{class:'dline',style:'color:#0E2238;border-bottom-color:#0E2238'});i.value=init||'';const p=dlg(title,i,[['Save',()=>i.value.trim()],['Cancel',null,'ghost']]);setTimeout(()=>i.focus(),50);return p;};
function toast(m,ms){const t=h('div',{class:'toast'},m);document.body.append(t);setTimeout(()=>t.remove(),ms||1800);}
const RANKS=[['Cabin boy','⚓'],['Deckhand','🛟'],['Able seaman','🧭'],['Petty officer','🚩'],['Bosun','📣'],['First mate','🚢'],['Chief officer','⛵'],['Staff captain','🎖️'],['Captain','🏅'],['Commodore','👑']];
const rank=m=>{const lv=Math.floor(m/150)+1,i=Math.min(lv-1,RANKS.length-1);return{lv,t:RANKS[i][0]+(lv>RANKS.length?' '+(lv-RANKS.length+1):''),ic:RANKS[i][1],pct:Math.round((m%150)/150*100)};};
async function award(d){const L=S.ledger,b=rank(L.miles).lv;L.miles+=d.miles||0;L.coal+=d.coal||0;L.stars+=d.stars||0;await setMeta('ledger',L);const a=rank(L.miles),nu=await checkScenes();
return [d.miles?' +'+d.miles+' mi':'',d.coal?' · +'+d.coal+' coal':'',d.stars?' · +'+d.stars+' ⭐':'',a.lv>b?'  🎉 Promoted: '+a.t+'!':'',nu.length?'  🎉 New scene unlocked: '+nu.join(', ')+'!':''].join('');}
const scoreLog=d=>{const t=k=>(d[k]||'').trim();const n=[t('eli10'),t('why'),t('steps'),t('example'),t('bug')&&t('fix'),t('q1')||t('q2')||t('q3'),t('summary')].filter(Boolean).length,all=n===7;
return{miles:n*15+(all?30:0),coal:n*5+(all?20:0),stars:n>=7?3:n>=5?2:n>=2?1:0};};
const owns=id=>price(id)===0||S.owned.includes(id);
const made=()=>S.items.filter(i=>i.type==='note'||i.type==='drawing').length;
const sceneOpen=id=>{const p=PAPERS[id];return !p||!p.need||(S.scenes||[]).includes(id);};
async function checkScenes(){S.scenes=S.scenes||[];const m=made(),n=[];for(const id of Object.keys(PAPERS)){const p=PAPERS[id];if(p.need&&!S.scenes.includes(id)&&m>=p.need){S.scenes.push(id);n.push(p.n);}}if(n.length)await setMeta('scenes',S.scenes);return n;}
const bal=()=>S.ledger.coal-S.owned.reduce((a,i)=>a+price(i),0);
function hud(){const L=S.ledger,R=rank(L.miles);return h('div',{class:'hud'},h('div',{class:'rk'},R.ic+' '+R.t),h('div',{class:'prog'},h('i',{style:'width:'+R.pct+'%'})),h('div',{class:'stats'},h('span',{},'🧭 '+L.miles+' mi'),h('span',{},'⛽ '+bal()+' coal'),h('span',{},'⭐ '+L.stars)));}

/* ---------- storage (IndexedDB) ---------- */
let db,mem=null;const M={items:new Map(),cols:new Map(),meta:new Map()};
const openDb=()=>new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('storage timed out')),2500);try{const r=indexedDB.open('shiplog2',1);
r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('cols',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};
r.onsuccess=()=>{clearTimeout(to);db=r.result;res();};r.onerror=()=>{clearTimeout(to);rej(r.error);};}catch(e){clearTimeout(to);rej(e);}});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m);const q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});
const all=s=>mem?Promise.resolve([...M[s].values()]):tx(s,'readonly',st=>st.getAll());
const put=(s,v)=>mem?(M[s].set(v.k||v.id,v),Promise.resolve()):tx(s,'readwrite',st=>st.put(v));
const del=(s,id)=>mem?(M[s].delete(id),Promise.resolve()):tx(s,'readwrite',st=>st.delete(id));
const putMany=(s,a)=>mem?(a.forEach(v=>M[s].set(v.id,v)),Promise.resolve()):tx(s,'readwrite',st=>{a.forEach(v=>st.put(v));});
const getMeta=async k=>{const r=mem?M.meta.get(k):await tx('meta','readonly',st=>st.get(k));return r&&r.v;};
const setMeta=(k,v)=>put('meta',{k,v});

const DEFNAME="J.J.'s Ship Log",DEFEMO='🚢';
const EMOS=['🚢','⛵','🛥️','🛳️','⚓','🧑‍✈️','🧭','🛟','🌊','🐳','🐙','🦈','🐬','🦀','🏴‍☠️','🔭','🚀','🛸','🤖','🦖','🐉','🔥','⚡','🌟','🎮','🔧','🧪','🎨','🦊','🐱'];
let S={shipName:DEFNAME,shipEmoji:DEFEMO,items:[],cols:[],draft:'',lastBackup:0,logDraft:null,drawDraft:null,ledger:{miles:0,coal:0,stars:0},owned:[]};
const shipName=()=>(S.shipName||'').trim()||DEFNAME;
const shipEmoji=()=>(S.shipEmoji||'').trim()||DEFEMO;
const firstEmoji=t=>{t=(t||'').trim();if(!t)return'';try{if(window.Intl&&Intl.Segmenter){return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(t)][0].segment;}}catch(e){}return [...t][0]||'';};
async function renameShip(){
let pick=shipEmoji();
const nm=h('input',{class:'dline',maxlength:'40',placeholder:'Ship name',style:'color:#0E2238;border-bottom-color:#0E2238'});nm.value=shipName();
const own=h('input',{class:'dline',placeholder:'or type your own emoji',style:'color:#0E2238;border-bottom-color:#0E2238;margin-top:8px'});
const grid=h('div',{class:'emogrid'});
const draw=()=>fill(grid,EMOS.map(e=>h('button',{class:'emo'+(e===pick?' on':''),'aria-label':'Emoji '+e,onclick:()=>{pick=e;own.value='';draw();}},e)));draw();
own.addEventListener('input',()=>{const f=firstEmoji(own.value);if(f){pick=f;draw();}});
const body=h('div',{},nm,h('div',{class:'lbl',style:'color:#0E2238'},'Pick your ship emoji'),grid,own);
const r=await dlg('Name your ship, Captain!',body,[['Save',()=>({name:nm.value.trim().slice(0,40),emoji:pick})],['Cancel',null,'ghost']]);
if(!r)return;S.shipName=r.name||DEFNAME;S.shipEmoji=r.emoji||DEFEMO;await setMeta('shipname',S.shipName);await setMeta('shipemoji',S.shipEmoji);document.title=shipName();toast('Ship ready ⚓ '+shipEmoji()+' '+shipName());render();}
const linerArt=()=>{const e=document.createElement('div');e.innerHTML='<svg class="banner-art" viewBox="0 0 700 150" role="img" aria-label="An ocean liner at sea"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4a78"/><stop offset="1" stop-color="#3f86b5"/></linearGradient></defs><rect width="700" height="150" rx="14" fill="url(#sk)"/><circle cx="590" cy="38" r="20" fill="#F3EAD3" opacity=".9"/><g fill="#fff" opacity=".85"><ellipse cx="120" cy="30" rx="36" ry="9"/><ellipse cx="148" cy="24" rx="24" ry="8"/><ellipse cx="430" cy="48" rx="30" ry="8"/></g><g><rect x="150" y="60" width="26" height="42" rx="3" fill="#C9A24B"/><rect x="150" y="60" width="26" height="8" fill="#222"/><rect x="198" y="52" width="26" height="50" rx="3" fill="#C9A24B"/><rect x="198" y="52" width="26" height="8" fill="#222"/><rect x="246" y="60" width="26" height="42" rx="3" fill="#C9A24B"/><rect x="246" y="60" width="26" height="8" fill="#222"/><rect x="294" y="68" width="26" height="34" rx="3" fill="#C9A24B"/><rect x="294" y="68" width="26" height="8" fill="#222"/><rect x="120" y="98" width="330" height="22" fill="#F3EAD3"/><rect x="120" y="98" width="330" height="5" fill="#D64541"/><path d="M96 98 L120 98 L120 120 L108 120 Z M450 98 L500 98 L474 120 L450 120 Z" fill="#F3EAD3"/><path d="M96 120 L474 120 L450 132 L120 132 Z" fill="#0E2238"/><g fill="#0E2238"><circle cx="140" cy="109" r="3"/><circle cx="165" cy="109" r="3"/><circle cx="190" cy="109" r="3"/><circle cx="215" cy="109" r="3"/><circle cx="240" cy="109" r="3"/><circle cx="265" cy="109" r="3"/><circle cx="290" cy="109" r="3"/><circle cx="315" cy="109" r="3"/><circle cx="340" cy="109" r="3"/><circle cx="365" cy="109" r="3"/><circle cx="390" cy="109" r="3"/><circle cx="415" cy="109" r="3"/></g></g><path d="M0 128 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V150 H0Z" fill="#14507a" opacity=".95"/><path d="M0 140 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V150 H0Z" fill="#0b3a5e"/></svg>';return e.firstChild;};

/* copy / share / save text (Quick Notes and Edit note) */
async function copyText(t){t=(t||'').trim();if(!t){toast('Nothing to copy yet');return;}
let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);ok=true;}}catch(e){}
if(!ok){try{const x=h('textarea',{style:'position:fixed;left:-999px;top:0;opacity:0'});x.value=t;document.body.append(x);x.focus();x.select();x.setSelectionRange(0,t.length);ok=document.execCommand('copy');x.remove();}catch(e){}}
if(ok)toast('Copied! Now paste it in your other app 📋');else say('Copy was blocked. Press and hold the words in the box, choose Select All, then Copy.');}
function saveTextFile(t,name){t=(t||'').trim();if(!t){toast('Nothing to save yet');return;}
const a=h('a',{href:URL.createObjectURL(new Blob([t],{type:'text/plain'})),download:(name||'note').replace(/[^\w\- ]+/g,'').trim().slice(0,30).replace(/ +/g,'-')+'.txt'});document.body.append(a);a.click();a.remove();toast('Saved as a text file 💾');}

async function migrate(){

const ls=k=>{try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[];}catch(e){return[];}};
const topics=ls('notebook-topics'),entries=ls('notebook-entries'),sk=ls('notebook-sketchbook');
await putMany('cols',topics.map(t=>({id:t.id,name:t.name,kind:'log'})));
await putMany('items',[
...entries.map(e=>({id:e.id,type:'log',text:e.eli10||e.summary||'(no words yet)',collectionId:e.topicId||null,createdAt:Date.parse(e.date)||Date.now(),data:e,earned:{miles:e.milesEarned||0,coal:e.coalEarned||0,stars:e.starsEarned||0}})),

/* ---------- Lifeboat code ---------- */
const PART=2500;
async function enc(obj){
let bytes=new TextEncoder().encode(JSON.stringify(obj)),flag='r';
if('CompressionStream' in window){bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());flag='z';}
let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
return flag+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function dec(s){
let b=s.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
let bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
if(s[0]==='z')bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
return JSON.parse(new TextDecoder().decode(bytes));}
const slim=i=>i.type==='log'&&i.data?Object.assign({},i,{data:Object.assign({},i.data,{sketchImage:null})}):i;
async function makeParts(){
const items=S.items.filter(i=>!(i.type==='drawing'&&i.image&&!i.scene)).map(slim);
const skipped=S.items.length-items.length;
const s=await enc({v:1,cols:S.cols,items,ledger:S.ledger,owned:S.owned,name:S.shipName,emoji:S.shipEmoji});
const id=uid().slice(0,4),n=Math.ceil(s.length/PART),parts=[];
for(let i=0;i<n;i++)parts.push(`LIFEBOAT|${id}|${i+1}|${n}|${s.slice(i*PART,(i+1)*PART)}`);
await setMeta('lastBackup',Date.now());S.lastBackup=Date.now();
return{parts,skipped};}
async function mergeIn(p){
const haveI=new Set(S.items.map(i=>i.id)),haveC=new Set(S.cols.map(c=>c.id));
const ni=(p.items||[]).filter(i=>!haveI.has(i.id)),nc=(p.cols||[]).filter(c=>!haveC.has(c.id));
await putMany('items',ni);await putMany('cols',nc);await reload();if(p.ledger){['miles','coal','stars'].forEach(k=>{S.ledger[k]=Math.max(S.ledger[k]||0,p.ledger[k]||0);});await setMeta('ledger',S.ledger);}if(p.owned){S.owned=[...new Set([...S.owned,...p.owned])];await setMeta('owned',S.owned);}if(p.name&&shipName()===DEFNAME&&p.name!==DEFNAME){S.shipName=String(p.name).slice(0,40);await setMeta('shipname',S.shipName);document.title=shipName();}if(p.emoji&&shipEmoji()===DEFEMO&&p.emoji!==DEFEMO){S.shipEmoji=String(p.emoji).slice(0,16);await setMeta('shipemoji',S.shipEmoji);}return ni.length;}
async function restoreCode(text){
const sets={};let m;const re=/LIFEBOAT\|(\w+)\|(\d+)\|(\d+)\|([A-Za-z0-9_-]+)/g;
while((m=re.exec(text))){(sets[m[1]]=sets[m[1]]||{n:+m[3],p:{}}).p[+m[2]]=m[4];}
const ids=Object.keys(sets);if(!ids.length)throw new Error('No Lifeboat code found. Paste every part, including the word LIFEBOAT.');
const set=sets[ids[ids.length-1]],miss=[];
for(let i=1;i<=set.n;i++)if(!set.p[i])miss.push(i);
if(miss.length)throw new Error('Missing part '+miss.join(', ')+' of '+set.n+'. Paste it too.');
let joined='';for(let i=1;i<=set.n;i++)joined+=set.p[i];
let payload;try{payload=await dec(joined);}catch(e){throw new Error('A part looks damaged. Copy the parts again and retry.');}
return mergeIn(payload);}
